# ─────────────────────────────────────────────────────────────────────────
# Модули Фазы 6 — AI + Прокси.
#
# Сервисы строятся из исходников tools/vendor/* (см. ./scripts/init-vendor.sh).
# Используют наши общие postgres + redis (из profile core).
# Роуты декларируются в infra/traefik/dynamic/services.yml (file-provider).
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     -f docker-compose.modules.yml --profile ai up -d
# ─────────────────────────────────────────────────────────────────────────

services:
  # ── sub2api — AI API-gateway (Claude / OpenAI / Gemini) ──
  # Запускается в режиме RUN_MODE=simple (без SaaS-биллинга),
  # как чистый прокси к upstream-провайдерам.
  sub2api:
    build:
      context: ./tools/vendor/sub2api
    image: aziral/sub2api:latest
    profiles: [ai]
    restart: unless-stopped
    environment:
      # Server
      BIND_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: "release"
      RUN_MODE: "simple"
      TZ: "Asia/Almaty"
      # Logging
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      LOG_OUTPUT_TO_STDOUT: "true"
      LOG_OUTPUT_TO_FILE: "false"
      # PostgreSQL (наш общий)
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${SUB2API_POSTGRES_DB:-sub2api}
      # Redis (наш общий)
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "3"
      # Admin (создаётся при первом запуске)
      ADMIN_EMAIL: ${SUB2API_ADMIN_EMAIL:-admin@cybersecurity.aziral.com}
      ADMIN_PASSWORD: ${SUB2API_ADMIN_PASSWORD}
      # Криптография (стабильные ключи между рестартами)
      JWT_SECRET: ${SUB2API_JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${SUB2API_TOTP_KEY}
      # Frontend URL (для писем / OAuth redirect)
      SERVER_FRONTEND_URL: "https://ai.${ROOT_DOMAIN}"
      # Безопасность: разрешаем internal hosts (мы в private docker net)
      SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS: "true"
      SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP: "true"
    volumes:
      - sub2api_data:/app/data
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # ── remnawave — Xray proxy panel (профиль net) ──
  # Backend + встроенный frontend admin UI. Использует наш postgres (DB remnawave)
  # и собственный valkey (так требует remnawave, через unix socket).
  # Node component (собственно Xray) ставится отдельно на другом VPS.
  remnawave:
    image: remnawave/backend:2
    profiles: [net]
    restart: unless-stopped
    environment:
      APP_PORT: "3000"
      METRICS_PORT: "3001"
      API_INSTANCES: "1"
      # Используем наш общий postgres, отдельная БД remnawave
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${REMNAWAVE_POSTGRES_DB:-remnawave}
      # Valkey через unix socket (как в их официальном compose)
      REDIS_SOCKET: /var/run/valkey/valkey.sock
      # JWT
      JWT_AUTH_SECRET: ${REMNAWAVE_JWT_AUTH_SECRET}
      JWT_API_TOKENS_SECRET: ${REMNAWAVE_JWT_API_SECRET}
      # Домены
      PANEL_DOMAIN: proxy.${ROOT_DOMAIN}
      FRONT_END_DOMAIN: "*"
      SUB_PUBLIC_DOMAIN: proxy.${ROOT_DOMAIN}/api/sub
      # Документация / метрики
      IS_DOCS_ENABLED: "false"
      METRICS_USER: ${REMNAWAVE_METRICS_USER:-metrics}
      METRICS_PASS: ${REMNAWAVE_METRICS_PASS}
      # Уведомления выключены пока нет нод
      IS_TELEGRAM_NOTIFICATIONS_ENABLED: "false"
      WEBHOOK_ENABLED: "false"
      BANDWIDTH_USAGE_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - remnawave-valkey-socket:/var/run/valkey
    networks: [edge, internal]
    depends_on:
      postgres: { condition: service_healthy }
      remnawave-valkey: { condition: service_healthy }

  remnawave-valkey:
    image: valkey/valkey:9-alpine
    profiles: [net]
    restart: unless-stopped
    volumes:
      - remnawave-valkey-socket:/var/run/valkey
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory-policy noeviction
      --loglevel warning
      --unixsocket /var/run/valkey/valkey.sock
      --unixsocketperm 777
      --port 0
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/var/run/valkey/valkey.sock", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks: [internal]

volumes:
  sub2api_data:
  remnawave-valkey-socket:

networks:
  edge:
    name: aziral_edge
    external: true
  internal:
    name: aziral_internal
    external: true
