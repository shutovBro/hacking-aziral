# ─────────────────────────────────────────────────────────────────────────
# Расширения платформы: полезные утилиты и альтернативы.
# Запуск: docker compose -f docker-compose.yml -f docker-compose.extra-modules.yml \
#   --profile pdf --profile webui --profile monitoring up -d
#
# Все подключаются за Traefik+SSO как основные сервисы.
# ─────────────────────────────────────────────────────────────────────────

services:
  # ───────────────────── PDF обработка (profile: pdf) ──────────────────────
  stirling-pdf:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    profiles: [pdf]
    restart: unless-stopped
    environment:
      # Настройки используются через переменные окружения, см. официальные доки
      DOCKER_ENABLE_SECURITY: "false"  # для локали; на проде усилить
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.pdf.rule: Host(`pdf.${ROOT_DOMAIN}`)
      traefik.http.routers.pdf.entrypoints: websecure
      traefik.http.routers.pdf.tls.certresolver: letsencrypt
      traefik.http.routers.pdf.middlewares: authentik@file
      traefik.http.services.pdf.loadbalancer.server.port: "8080"

  # ───────────────── Веб-UI к AI моделям (profile: webui) ─────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    profiles: [webui]
    restart: unless-stopped
    environment:
      # Подключение к sub2api (если он есть) или Ollama:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-dummy}
      OPENAI_API_BASE_URL: http://sub2api:8080/v1
      # Для локального Ollama: http://ollama:11434
    networks: [edge, internal]
    depends_on:
      - redis                        # Redis используется для сессий
    labels:
      traefik.enable: "true"
      traefik.http.routers.webui.rule: Host(`webui.${ROOT_DOMAIN}`)
      traefik.http.routers.webui.entrypoints: websecure
      traefik.http.routers.webui.tls.certresolver: letsencrypt
      traefik.http.routers.webui.middlewares: authentik@file
      traefik.http.services.webui.loadbalancer.server.port: "3000"

  # ────────────── Мониторинг доступности (profile: monitoring) ────────────
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    networks: [edge, internal]
    labels:
      traefik.enable: "true"
      traefik.http.routers.uptime.rule: Host(`uptime.${ROOT_DOMAIN}`)
      traefik.http.routers.uptime.entrypoints: websecure
      traefik.http.routers.uptime.tls.certresolver: letsencrypt
      traefik.http.routers.uptime.middlewares: authentik@file
      traefik.http.services.uptime.loadbalancer.server.port: "3001"

volumes:
  uptime-kuma-data:

networks:
  edge:
    name: aziral_edge
    external: true
  internal:
    name: aziral_internal
    external: true
