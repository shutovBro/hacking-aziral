server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Безопасность (CSP + базовые заголовки) ──
    # SPA Vite отдаёт внешние JS/CSS (без inline-скриптов), поэтому script-src 'self'.
    # 'unsafe-inline' для style-src нужен из-за inline-стилей React (style={{}}).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # SPA: все маршруты → index.html (роутинг на стороне React).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеш статики
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
