# Статическая конфигурация Traefik. Все роуты — через file-провайдер
# (см. dynamic/services.yml), без зависимости от Docker API discovery.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      middlewares:
        - security-headers@file

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

