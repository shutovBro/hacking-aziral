# Production: TLS терминируется на NPM, Traefik доверяет X-Forwarded-Proto:https от NPM.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
log:
  level: INFO
api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ':80'
    # ВАЖНО: доверяем заголовкам X-Forwarded-* от Docker-сетей (где сидит NPM).
    # insecure: true — принимаем headers от ВСЕХ источников. На проде платформа
    # доступна только через внутреннюю сеть Docker, наружу 80/443 не открыты.
    forwardedHeaders:
      insecure: true
    http:
      middlewares:
        - security-headers@file
  websecure:
    address: ':443'
    forwardedHeaders:
      insecure: true
    http:
      middlewares:
        - security-headers@file

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
