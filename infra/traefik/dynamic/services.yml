# TLS: по умолчанию Traefik отдаёт самоподписанный серт, если в роуте нет certResolver.
# На проде замени `tls: {}` ниже на `tls: { certResolver: letsencrypt }`.

# Динамические роуты Traefik (file-provider).
# Без зависимости от Docker API — всё описано декларативно.
# Имена хостов берутся через подстановку Traefik (`{{env "ROOT_DOMAIN"}}` не работает в file-provider),
# поэтому здесь жёстко зашит cybersecurity.aziral.com. Если меняешь ROOT_DOMAIN — поправь и тут.

http:
  routers:
    # ── Aziral Core (frontend SPA + /api на backend) ──
    core-web:
      rule: "Host(`cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: core-frontend
      middlewares: [authentik]

    core-api:
      rule: "Host(`cybersecurity.aziral.com`) && PathPrefix(`/api`)"
      entryPoints: [web]
      service: core-backend
      middlewares: [authentik, rate-limit]

    # ── Authentik (SSO UI и forward-auth endpoint) ──
    authentik:
      rule: "Host(`auth.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: authentik
      # Сам Authentik НЕ защищаем forward-auth — иначе бесконечный редирект.

    # ── SpiderFoot ──
    spiderfoot:
      rule: "Host(`spiderfoot.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: spiderfoot
      middlewares: [authentik]

    # ── Superset ──
    superset:
      rule: "Host(`superset.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: superset
      middlewares: [authentik]

    # ── Activepieces ──
    flows:
      rule: "Host(`flows.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: activepieces
      middlewares: [authentik]

    # ── Cronicle ──
    cron:
      rule: "Host(`cron.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: cronicle
      middlewares: [authentik]

    # ── Web-terminal (ttyd) ──
    webterm:
      rule: "Host(`term.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: webterm
      middlewares: [authentik]

    # ── Traefik dashboard (защищён SSO) ──
    dashboard:
      rule: "Host(`traefik.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: api@internal
      middlewares: [authentik]

    # ── Stirling-PDF (extra-modules) ──
    pdf:
      rule: "Host(`pdf.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: stirling-pdf
      middlewares: [authentik]

    # ── Open WebUI (extra-modules) ──
    webui:
      rule: "Host(`webui.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: open-webui
      middlewares: [authentik]

    # ── Uptime Kuma (extra-modules) ──
    uptime:
      rule: "Host(`uptime.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: uptime-kuma
      middlewares: [authentik]

    # ── sub2api (AI gateway, modules profile ai) ──
    sub2api:
      rule: "Host(`ai.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: sub2api
      middlewares: [authentik]

    # ── remnawave (Xray proxy panel, modules profile net) ──
    # Поддомен proxy.* как и было запланировано в Modules.tsx
    remnawave:
      rule: "Host(`proxy.cybersecurity.aziral.com`)"
      entryPoints: [web]
      service: remnawave
      middlewares: [authentik]

  services:
    core-frontend:
      loadBalancer:
        servers:
          - url: "http://core-frontend:80"
    core-backend:
      loadBalancer:
        servers:
          - url: "http://core-backend:8000"
    authentik:
      loadBalancer:
        servers:
          - url: "http://authentik-server:9000"
    spiderfoot:
      loadBalancer:
        servers:
          - url: "http://spiderfoot:5001"
    superset:
      loadBalancer:
        servers:
          - url: "http://superset:8088"
    activepieces:
      loadBalancer:
        servers:
          - url: "http://activepieces:80"
    cronicle:
      loadBalancer:
        servers:
          - url: "http://cronicle:3012"
    webterm:
      loadBalancer:
        servers:
          - url: "http://webterm:7681"
    stirling-pdf:
      loadBalancer:
        servers:
          - url: "http://stirling-pdf:8080"
    open-webui:
      loadBalancer:
        servers:
          - url: "http://open-webui:8080"
    uptime-kuma:
      loadBalancer:
        servers:
          - url: "http://uptime-kuma:3001"
    sub2api:
      loadBalancer:
        servers:
          - url: "http://sub2api:8080"
    remnawave:
      loadBalancer:
        servers:
          - url: "http://remnawave:3000"
