# Динамические middlewares Traefik.
http:
  middlewares:
    # Security-заголовки (по web/security правилам).
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        browserXssFilter: true
        frameDeny: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # Forward-auth на Authentik: защищает любой сервис единым SSO.
    # Подключается к сервисам label-ом: traefik.http.routers.<r>.middlewares=authentik@file
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt

    # Rate-limit для чувствительных эндпоинтов (запуск сканов и т.п.).
    rate-limit:
      rateLimit:
        average: 30
        burst: 15

    # StripPrefix /legal for the legal-nginx sidecar
    legal-stripprefix:
      stripPrefix:
        prefixes:
          - /legal

    # Strict rate-limit for login endpoint (brute-force jail)
    login-rate-limit:
      rateLimit:
        average: 5      # ~5 attempts per second...
        period: 60s     # ...averaged over 1 minute = 300/min sustained max
        burst: 10       # but bursts up to 10 allowed
        sourceCriterion:
          ipStrategy:
            depth: 2     # trust CF + Traefik forwarded-for hops
